<!doctype html>

<html lang="zh-CN">

  <head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="MassAgent - 质谱数据分析智能 Agent" />

    <title>MassAgent · 质谱 Agent</title>

    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />

    <link rel="stylesheet" href="/static/styles.css" />

  </head>

  <body>

    <div id="sharedBanner" class="shared-banner hidden">

      <span data-i18n="shared.banner">只读分享视图 · 他人可查看此会话，无法发送消息</span>

      <button id="exitShareViewBtn" type="button" class="secondary-btn" data-i18n="shared.exit">

        返回我的会话

      </button>

    </div>



    <div class="app">

      <aside class="session-sidebar">

        <div class="sidebar-header">

          <div class="brand">

            <h1>MassAgent</h1>

            <p class="brand-sub" data-i18n="brand.sub">质谱数据分析 Agent</p>

          </div>

          <button id="newSessionBtn" type="button" data-i18n="btn.newSession">+ 新会话</button>

        </div>



        <section class="sidebar-card" id="runtimeCard">

          <h2 data-i18n="runtime.title">运行环境</h2>

          <div id="runtimeInfo" class="runtime-info muted" data-i18n="runtime.detecting">正在检测…</div>

        </section>



        <section class="sidebar-card">

          <h2 data-i18n="workflow.title">使用方式</h2>

          <ol class="workflow-list">

            <li data-i18n="workflow.step1">在发送按钮左侧上传一个或多个文件</li>

            <li data-i18n="workflow.step2">用自然语言描述分析目标</li>

            <li data-i18n="workflow.step3">Agent 自动选择合适工具执行</li>

          </ol>

        </section>



        <!-- 暂时隐藏左侧可用工具栏（后续可能恢复）
        <section class="sidebar-card tools-sidebar">

          <h2>

            <span data-i18n="tools.title">可用工具</span>

            <span id="toolsCount" class="tools-count"></span>

          </h2>

          <div id="toolsSidebar" class="tools-sidebar-list"></div>

        </section>
        -->



        <div id="sessionList" class="session-list"></div>

      </aside>



      <main class="chat-panel">

        <header class="chat-toolbar">

          <div class="toolbar-group">

            <label for="modelSelect" data-i18n="toolbar.model">模型</label>

            <select id="modelSelect"></select>

          </div>

          <div class="toolbar-group">

            <label for="tempInput" data-i18n="toolbar.temp">Temperature</label>

            <input id="tempInput" type="number" min="0" max="2" step="0.1" value="0" />

          </div>

          <div class="toolbar-group lang-group">

            <label for="langSelect" data-i18n="toolbar.lang">Language</label>

            <select id="langSelect" aria-label="Language">

              <option value="zh-CN">中文</option>

              <option value="en">English</option>

            </select>

          </div>

          <button id="clearSessionBtn" type="button" class="secondary-btn" data-i18n="toolbar.clearSession">

            清空会话

          </button>

          <div class="toolbar-group share-group">

            <button id="shareBtn" type="button" class="secondary-btn" data-i18n="toolbar.share">

              复制分享链接

            </button>

            <span id="shareStatus" class="share-status"></span>

          </div>

        </header>



        <div class="chat-main">

          <!-- 欢迎区 + 中间工具列表（暂隐藏，后续可能恢复）
          <section id="welcomePanel" class="welcome-panel">

            <h2 data-i18n="welcome.title">MassAgent 能做什么？</h2>

            <p data-i18n="welcome.desc">

              上传 raw / mzML / mgf / rds 等质谱相关文件，用对话驱动完整分析流程。

              Agent 会根据你的描述，从下方工具库中自动选择合适步骤。

            </p>

            <div id="toolsPanel" class="tools-panel"></div>

          </section>
          -->

          <div id="messages" class="messages"></div>

        </div>



        <div id="composer" class="composer">

          <div id="attachmentBar" class="attachment-bar hidden">

            <div id="attachmentList" class="attachment-list"></div>

          </div>

          <form id="chatForm" class="chat-input-row">

            <textarea

              id="promptInput"

              data-i18n-placeholder="composer.placeholder"

              placeholder="描述分析需求；上传 .raw 等文件后将自动调用 MCP 工具执行（Enter 发送）"

            ></textarea>

            <div class="composer-actions">

              <button

                id="attachBtn"

                type="button"

                class="icon-btn"

                data-i18n-title="attach.title"

                title="添加附件"

              >

                📎

              </button>

              <input id="fileInput" type="file" multiple />

              <button

                type="button"

                id="stopButton"

                class="stop-btn hidden"

                data-i18n-title="stop.title"

                title="终止生成"

                data-i18n="btn.stop"

              >

                终止

              </button>

              <button type="submit" id="sendButton" data-i18n="btn.send">发送</button>

            </div>

          </form>

        </div>

        <p id="statusText" class="status-text"></p>

      </main>



      <aside class="files-panel" id="filesPanel">

        <div class="files-panel-header">

          <h2 data-i18n="files.title">会话文件</h2>

          <button id="refreshFilesBtn" type="button" class="secondary-btn small-btn" data-i18n="files.refresh">

            刷新

          </button>

        </div>

        <p id="filesPanelHint" class="files-hint muted" data-i18n="files.hint">切换会话后显示输入/输出文件</p>

        <section class="files-section">

          <h3 data-i18n="files.input">输入（上传）</h3>

          <p id="inputFilesDir" class="files-dir muted"></p>

          <ul id="inputFilesList" class="file-tree"></ul>

        </section>

        <section class="files-section">

          <h3 data-i18n="files.output">输出（Agent）</h3>

          <p id="outputFilesDir" class="files-dir muted"></p>

          <div id="outputImageGallery" class="output-image-gallery hidden"></div>

          <ul id="outputFilesList" class="file-tree"></ul>

        </section>

      </aside>

    </div>



    <div id="imageLightbox" class="image-lightbox hidden" role="dialog" aria-modal="true" aria-hidden="true">

      <div class="image-lightbox-backdrop" id="lightboxBackdrop"></div>

      <div class="image-lightbox-panel">

        <header class="image-lightbox-header">

          <span id="lightboxTitle" class="image-lightbox-title"></span>

          <button id="lightboxClose" type="button" class="icon-btn" aria-label="Close">×</button>

        </header>

        <div class="image-lightbox-body">

          <img id="lightboxImg" alt="" />

        </div>

      </div>

    </div>



    <div id="imageEditor" class="image-editor hidden" role="dialog" aria-modal="true" aria-hidden="true">

      <div class="image-editor-backdrop" id="editorBackdrop"></div>

      <div class="image-editor-panel">

        <header class="image-editor-header">

          <span id="editorTitle" class="image-editor-title"></span>

          <button id="editorClose" type="button" class="icon-btn" aria-label="Close">×</button>

        </header>

        <div class="image-editor-body">

          <aside class="image-editor-toolbar">

            <button id="editorAddTitle" type="button" class="secondary-btn" data-i18n="image.addTitle">
              添加标题
            </button>

            <button id="editorAddText" type="button" class="secondary-btn" data-i18n="image.addText">
              添加文字
            </button>

            <button id="editorAddArrow" type="button" class="secondary-btn" data-i18n="image.addArrow">
              添加箭头
            </button>

            <button id="editorAddColorBlock" type="button" class="secondary-btn" data-i18n="image.addColorBlock">
              添加色块
            </button>

            <label class="image-editor-field">
              <span data-i18n="image.text">文字</span>
              <input id="editorTextInput" type="text" data-i18n-placeholder="image.textPlaceholder" placeholder="选择文字后编辑" />
            </label>

            <label class="image-editor-field">
              <span data-i18n="image.color">颜色</span>
              <input id="editorColorInput" type="color" value="#111827" />
            </label>

            <label class="image-editor-field">
              <span data-i18n="image.fontSize">字号</span>
              <input id="editorFontSizeInput" type="number" min="8" max="96" value="28" />
            </label>

            <button id="editorDelete" type="button" class="secondary-btn" data-i18n="image.deleteSelected">
              删除选中
            </button>

            <p id="editorStatus" class="image-editor-status"></p>

          </aside>

          <div class="image-editor-canvas-wrap">

            <div id="editorStageScaler" class="image-editor-stage-scaler">
              <div id="editorStage" class="image-editor-stage"></div>
            </div>

          </div>

        </div>

        <footer class="image-editor-footer">

          <button id="editorCancel" type="button" class="secondary-btn" data-i18n="msg.cancel">取消</button>

          <button id="editorSave" type="button" data-i18n="image.save">保存为新图</button>

        </footer>

      </div>

    </div>


    <div id="plotlyEditor" class="plotly-editor hidden" role="dialog" aria-modal="true" aria-hidden="true">

      <div class="plotly-editor-backdrop" id="plotlyEditorBackdrop"></div>

      <div class="plotly-editor-panel">

        <header class="plotly-editor-header">
          <span id="plotlyEditorTitle" class="plotly-editor-title"></span>
          <button id="plotlyEditorClose" type="button" class="icon-btn" aria-label="Close">×</button>
        </header>

        <div class="plotly-editor-body">
          <p id="plotlyEditorHint" class="plotly-editor-hint muted" data-i18n="image.plotlyHint">
            点击图例项，或在下拉框中选择系列，再点击右侧颜色块修改颜色；双击标题可修改标题文字。
          </p>
          <div id="plotlyLegendColorRow" class="plotly-legend-color-row">
            <label class="plotly-legend-color-field">
              <span data-i18n="image.plotlyLegendColor">图例系列</span>
              <select id="plotlyTraceSelect" class="plotly-trace-select" aria-label="选择图例系列"></select>
            </label>
            <label class="plotly-legend-color-field">
              <span data-i18n="image.color">颜色</span>
              <input id="plotlyLegendColorInput" type="color" class="plotly-legend-color-input" title="选择颜色" />
            </label>
          </div>
          <div id="plotlyChart" class="plotly-chart"></div>
        </div>

        <footer class="plotly-editor-footer">
          <button id="plotlyEditorCancel" type="button" class="secondary-btn" data-i18n="msg.cancel">取消</button>
          <button id="plotlyEditorSave" type="button" data-i18n="image.save">保存为新图</button>
        </footer>

        <p id="plotlyEditorStatus" class="plotly-editor-status"></p>

      </div>

    </div>


    <script src="https://cdn.plot.ly/plotly-2.35.3.min.js"></script>
    <script src="https://unpkg.com/konva@latest/konva.min.js"></script>

    <script src="/static/i18n.js?v=20260624"></script>

    <script src="/static/app.js?v=20260624"></script>

  </body>

</html>
